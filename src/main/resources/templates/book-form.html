<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book form | Library</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">📚 Library<span>OS</span></a><nav><a href="/">Dashboard</a><a href="/books">Books</a><a href="/students">Students</a></nav><div class="account"><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header>
<main><div class="page-title"><div><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1 th:text="${formTitle}">Book form</h1><p>Enter the book details below.</p></div></div><section class="form-panel"><form th:action="@{/admin/books/save}" th:object="${book}" method="post" class="form-grid"><input type="hidden" th:field="*{id}"><div class="field"><label>ISBN *</label><input th:field="*{isbn}" required><small class="validation" th:errors="*{isbn}"></small></div><div class="field"><label>Book title *</label><input th:field="*{title}" required><small class="validation" th:errors="*{title}"></small></div><div class="field"><label>Author *</label><input th:field="*{author}" required><small class="validation" th:errors="*{author}"></small></div><div class="field"><label>Category</label><input th:field="*{category}" placeholder="e.g. Computer Science"></div><div class="field"><label>Cover image path</label><input th:field="*{coverImage}" placeholder="/images/books/book.svg"></div><div class="field"><label>Publisher</label><input th:field="*{publisher}"></div><div class="field"><label>Publication year</label><input th:field="*{publicationYear}" type="number" min="1000" max="2100"></div><div class="field"><label>Total quantity *</label><input th:field="*{quantity}" type="number" min="1" required></div><div class="field"><label>Shelf / rack number</label><input th:field="*{shelfNumber}" placeholder="e.g. A-12"></div><div class="field full-field"><label>Description</label><textarea th:field="*{description}" rows="4"></textarea></div><div class="form-actions full-field"><a href="/books" class="secondary-btn">Cancel</a><button class="button">Save book</button></div></form></section></main></body></html>
