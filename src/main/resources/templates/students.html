<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students | Library</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">📚 Library<span>OS</span></a><nav><a href="/">Dashboard</a><a href="/books">Books</a><a class="active" href="/students">Students</a><a href="/issue">Issue / Return</a><a href="/transactions">Transactions</a></nav><div class="account"><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header>
<main><div class="page-title"><div><p class="eyebrow">MEMBERS</p><h1>Students</h1><p>Manage registered library members.</p></div><a class="button" href="/admin/students/new">＋ Add student</a></div><div class="alert success" th:if="${message}" th:text="${message}"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Course</th><th>Semester</th><th>Status</th></tr></thead><tbody><tr th:each="s : ${students}"><td><b th:text="${s.name}"></b></td><td th:text="${s.email}"></td><td th:text="${s.phone}"></td><td th:text="${s.department}"></td><td th:text="${s.course}"></td><td th:text="${s.semester}"></td><td><span class="status available" th:text="${s.active ? 'Active' : 'Inactive'}"></span></td></tr></tbody></table></div></section></main></body></html>
