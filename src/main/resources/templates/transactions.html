<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | Library</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">📚 Library<span>OS</span></a><nav><a href="/">Dashboard</a><a href="/books">Books</a><a href="/students">Students</a><a href="/issue">Issue / Return</a><a class="active" href="/transactions">Transactions</a></nav><div class="account"><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header>
<main><div class="page-title"><div><p class="eyebrow">CIRCULATION HISTORY</p><h1>Transactions</h1><p>Track issued books, due dates, returns and fines.</p></div><a href="/issue" class="button">＋ Issue a book</a></div><div class="alert success" th:if="${message}" th:text="${message}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Book / Student</th><th>Issue date</th><th>Loan</th><th>Due date</th><th>Return date</th><th>Status</th><th>Fine</th><th>Action</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td><b th:text="${t.book.title}"></b><small class="subtext" th:text="${t.student.name}"></small></td><td th:text="${t.issueDate}"></td><td th:text="${t.loanDays + ' days'}"></td><td><b th:text="${t.dueDate}"></b><small class="subtext" th:if="${t.status == 'ISSUED' and t.overdueDays > 0}" th:text="${t.overdueDays + ' day(s) overdue'}"></small></td><td th:text="${t.returnDate == null ? '—' : t.returnDate}"></td><td><span th:class="${t.status == 'ISSUED' ? 'status issued' : 'status available'}" th:text="${t.status}"></span></td><td><b th:text="${'₹' + (t.status == 'ISSUED' ? t.accruedFine : t.fine)}"></b><small class="subtext" th:if="${t.status == 'ISSUED' and t.accruedFine > 0}">Accruing daily</small></td><td><form th:if="${t.status == 'ISSUED'}" th:action="@{'/return/' + ${t.id}}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="small-btn">Return</button></form><span th:if="${t.status != 'ISSUED'}">Completed</span></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="8" class="empty">No borrowing transactions yet.</td></tr></tbody></table></div></section></main></body></html>
