<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add student | Library</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">📚 Library<span>OS</span></a><nav><a href="/">Dashboard</a><a href="/students">Students</a></nav><div class="account"><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header>
<main><div class="page-title"><div><p class="eyebrow">MEMBER MANAGEMENT</p><h1>Add student</h1><p>Create a member record for borrowing transactions.</p></div></div><section class="form-panel"><form th:action="@{/admin/students/save}" th:object="${student}" method="post" class="form-grid"><div class="field"><label>Full name *</label><input th:field="*{name}" required><small class="validation" th:errors="*{name}"></small></div><div class="field"><label>Email *</label><input th:field="*{email}" type="email" required><small class="validation" th:errors="*{email}"></small></div><div class="field"><label>Phone</label><input th:field="*{phone}"></div><div class="field"><label>Department</label><input th:field="*{department}"></div><div class="field"><label>Course</label><input th:field="*{course}"></div><div class="field"><label>Semester</label><input th:field="*{semester}" type="number" min="1" max="12"></div><div class="form-actions full-field"><a href="/students" class="secondary-btn">Cancel</a><button class="button">Save student</button></div></form></section></main></body></html>
