<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue book | Library</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">📚 Library<span>OS</span></a><nav><a href="/">Dashboard</a><a href="/books">Books</a><a href="/students">Students</a><a class="active" href="/issue">Issue / Return</a><a href="/transactions">Transactions</a></nav><div class="account"><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Log out</button></form></div></header>
<main><div class="page-title"><div><p class="eyebrow">CIRCULATION DESK</p><h1>Issue a book</h1><p>Assign an available copy to a registered student.</p></div></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="form-panel narrow"><div class="policy"><b>Borrowing policy</b><p>Loan period: choose 7 or 30 days · Late return fine: ₹5 per day</p></div><form method="post" action="/issue" class="form-grid single"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Select book *</label><select name="bookId" required><option value="">Choose a book</option><option th:each="b : ${books}" th:if="${b.availableQuantity > 0}" th:value="${b.id}" th:text="${b.title + ' — ' + b.author + ' (' + b.availableQuantity + ' available)'}"></option></select></div><div class="field"><label>Loan period *</label><select name="loanDays" required><option value="7" selected>7 days</option><option value="30">30 days</option></select><small class="subtext">Fine starts automatically after the due date.</small></div><div class="field"><label>Select student *</label><select name="studentId" required><option value="">Choose a student</option><option th:each="s : ${students}" th:if="${s.active}" th:value="${s.id}" th:text="${s.name + ' — ' + s.email}"></option></select></div><button class="button">Confirm issue</button></form></section></main></body></html>
